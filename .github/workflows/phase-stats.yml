name: Player splits from Cricsheet

# Builds the match engine's ball-by-ball data from Cricsheet and commits it:
#   data/phase-stats.sql            powerplay / middle / death numbers (T20, ODI)
#   data/player-splits.sql          batting position, region of the ground, batting first v chasing
#   src/core/data-norms.generated.ts  typical international numbers and par scores at the game's grounds
# Run it from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download ball-by-ball data
        run: |
          for f in t20s odis tests; do
            mkdir -p data/raw/${f}_json
            curl -sSfL https://cricsheet.org/downloads/${f}_json.zip -o data/raw/${f}_json.zip
            unzip -q data/raw/${f}_json.zip -d data/raw/${f}_json
          done
      - run: npx tsx src/etl/splits.ts data/raw
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase-stats.sql data/player-splits.sql src/core/data-norms.generated.ts
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "data: player splits from Cricsheet"
          # Someone may have pushed while this ran: replay the data commit on top
          git pull --rebase origin main
          git push
